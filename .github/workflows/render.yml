name: Render episode

# Public orchestrator for the episode pipeline. Runs from this public repo so it
# uses free CI minutes, checks out the private content repo with a token, and
# hands each phase to vidgen's ci.py.
#
# Two things were removed on 11 Sep 2026:
#   1. The Blender job. No episode has ever opted a scene into `scene.blender`,
#      and blender/ was deleted from the content repo.
#   2. The placeholder thumbnail. Thumbnails are authored at Gate 1 with Google
#      Flow plus Canva, so the coded plate that ci.py used to render and copy to
#      Drive was pure noise. The gather phase is now called through a tiny
#      wrapper that disables that one function. Everything else is unchanged.

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode id (folder name, e.g. episode01)"
        required: true
        default: "episode01"

concurrency:
  group: render-${{ github.event.inputs.episode }}
  cancel-in-progress: false

env:
  CI_QUIET: "1"

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      matrix: ${{ steps.prep.outputs.matrix }}

    steps:
      - name: Checkout content repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CONTENT_REPO }}
          token: ${{ secrets.CONTENT_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Prepare episode (whisper, timing, plan, shard ranges)
        id: prep
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
          VIDEO_DRIVE_SUBDIR: ${{ secrets.VIDEO_DRIVE_SUBDIR }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}
        run: python ci.py prep "${{ github.event.inputs.episode }}"

      - name: Upload prep artifact
        uses: actions/upload-artifact@v4
        with:
          name: prep
          path: |
            out/**
            public/episodes/**
          if-no-files-found: warn
          retention-days: 1

  render:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 300

    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJSON(needs.prep.outputs.matrix) }}

    steps:
      - name: Checkout content repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CONTENT_REPO }}
          token: ${{ secrets.CONTENT_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Remotion browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: ${{ runner.os }}-remotion-browser

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download prep artifact
        uses: actions/download-artifact@v4
        with:
          name: prep

      - name: Render shard ${{ matrix.shard }}
        run: >
          python ci.py render-shard
          "${{ github.event.inputs.episode }}"
          ${{ matrix.shard }}
          ${{ matrix.start }}
          ${{ matrix.end }}

      - name: Upload segment
        uses: actions/upload-artifact@v4
        with:
          name: segment-${{ matrix.shard }}
          path: out/seg-${{ matrix.shard }}.mp4
          if-no-files-found: error
          retention-days: 1

  gather:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout content repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CONTENT_REPO }}
          token: ${{ secrets.CONTENT_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Remotion browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: ${{ runner.os }}-remotion-browser

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download prep artifact
        uses: actions/download-artifact@v4
        with:
          name: prep

      - name: Download all segments
        uses: actions/download-artifact@v4
        with:
          pattern: segment-*
          merge-multiple: true
          path: segments

      - name: Gather, mux audio, upload (no thumbnail)
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
          VIDEO_DRIVE_SUBDIR: ${{ secrets.VIDEO_DRIVE_SUBDIR }}
          EPISODE: ${{ github.event.inputs.episode }}
        run: |
          python - <<'PY'
          import os
          import ci

          # Thumbnails are authored at Gate 1 with Google Flow plus Canva. The
          # coded placeholder plate is therefore never rendered and never copied
          # to Drive. Remove these two lines to restore the old behaviour.
          ci._render_thumbnail = lambda *a, **k: None

          ci.gather(os.environ["EPISODE"])
          PY
